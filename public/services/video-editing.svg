<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FAFAF7" />
  
  <!-- Video Preview Window -->
  <rect x="230" y="90" width="340" height="200" rx="6" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <rect x="250" y="110" width="300" height="160" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Amber Play Button in Preview -->
  <polygon points="390,175 425,195 390,215" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" />
  
  <!-- Timeline Track Box -->
  <rect x="150" y="330" width="500" height="180" rx="6" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  
  <!-- Time Ruler -->
  <line x1="150" y1="365" x2="650" y2="365" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="200" y1="355" x2="200" y2="365" stroke="#1E40AF" stroke-width="1" />
  <line x1="250" y1="350" x2="250" y2="365" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="300" y1="355" x2="300" y2="365" stroke="#1E40AF" stroke-width="1" />
  <line x1="350" y1="350" x2="350" y2="365" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="400" y1="355" x2="400" y2="365" stroke="#1E40AF" stroke-width="1" />
  <line x1="450" y1="350" x2="450" y2="365" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="500" y1="355" x2="500" y2="365" stroke="#1E40AF" stroke-width="1" />
  <line x1="550" y1="350" x2="550" y2="365" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="600" y1="355" x2="600" y2="365" stroke="#1E40AF" stroke-width="1" />
  
  <!-- Video Track 1 Clips -->
  <rect x="180" y="385" width="130" height="40" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <rect x="320" y="385" width="160" height="40" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <rect x="490" y="385" width="120" height="40" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Audio Track 2 Clips -->
  <rect x="180" y="445" width="220" height="35" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <rect x="410" y="445" width="200" height="35" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Playhead line -->
  <line x1="375" y1="340" x2="375" y2="500" stroke="#1E40AF" stroke-width="2" />
  <polygon points="368,340 382,340 375,350" fill="#1E40AF" />
</svg>
