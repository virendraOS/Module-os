<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FAFAF7" />
  
  <!-- Clean Table with Check Marks -->
  <rect x="160" y="140" width="320" height="300" rx="6" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <rect x="160" y="140" width="320" height="45" rx="6" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  
  <line x1="190" y1="162" x2="260" y2="162" stroke="#1E40AF" stroke-width="2" />
  <line x1="300" y1="162" x2="420" y2="162" stroke="#1E40AF" stroke-width="2" />
  
  <!-- Row 1 with Check -->
  <line x1="160" y1="225" x2="480" y2="225" stroke="#1E40AF" stroke-width="1" />
  <polyline points="190,205 198,213 214,197" fill="none" stroke="#1E40AF" stroke-width="2" />
  <line x1="240" y1="205" x2="440" y2="205" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Row 2 with Check -->
  <line x1="160" y1="290" x2="480" y2="290" stroke="#1E40AF" stroke-width="1" />
  <polyline points="190,270 198,278 214,262" fill="none" stroke="#1E40AF" stroke-width="2" />
  <line x1="240" y1="270" x2="410" y2="270" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Row 3 with Check -->
  <line x1="160" y1="355" x2="480" y2="355" stroke="#1E40AF" stroke-width="1" />
  <polyline points="190,335 198,343 214,327" fill="none" stroke="#1E40AF" stroke-width="2" />
  <line x1="240" y1="335" x2="430" y2="335" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Row 4 with Check -->
  <polyline points="190,400 198,408 214,392" fill="none" stroke="#1E40AF" stroke-width="2" />
  <line x1="240" y1="400" x2="390" y2="400" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Clock Element (Right) -->
  <circle cx="580" cy="220" r="60" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <circle cx="580" cy="220" r="3" fill="#1E40AF" />
  <line x1="580" y1="220" x2="580" y2="185" stroke="#1E40AF" stroke-width="2" />
  <!-- Amber Accent on Clock Minute Hand -->
  <line x1="580" y1="220" x2="605" y2="220" stroke="#F59E0B" stroke-width="2.5" />
  
  <!-- Circular Backup Arrow below Clock -->
  <path d="M 540 370 A 50 50 0 1 1 630 370" fill="none" stroke="#1E40AF" stroke-width="2" stroke-dasharray="6 3" />
  <polygon points="620,360 635,372 622,382" fill="#1E40AF" />
  <rect x="560" y="350" width="40" height="40" rx="4" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="570" y1="370" x2="590" y2="370" stroke="#1E40AF" stroke-width="1.5" />
</svg>
