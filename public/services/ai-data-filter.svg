<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FAFAF7" />
  
  <!-- Left Side: Messy rows / disorganized data blocks -->
  <g transform="translate(120, 160)">
    <!-- Unaligned, fragmented rows -->
    <rect x="0" y="20" width="140" height="35" rx="3" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" transform="rotate(-3, 70, 37)" />
    <line x1="15" y1="37" x2="110" y2="37" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="8 4" />
    
    <rect x="20" y="90" width="150" height="35" rx="3" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" transform="rotate(4, 95, 107)" />
    <line x1="35" y1="107" x2="140" y2="107" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="12 4" />
    
    <rect x="-10" y="160" width="160" height="35" rx="3" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" transform="rotate(-2, 70, 177)" />
    <line x1="10" y1="177" x2="130" y2="177" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="6 3" />
    
    <rect x="10" y="230" width="130" height="35" rx="3" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" transform="rotate(2, 75, 247)" />
    <line x1="25" y1="247" x2="110" y2="247" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="10 5" />
  </g>
  
  <!-- Center: Filter Funnel with Amber Accent rim -->
  <path d="M 330 180 L 470 180 L 420 310 L 420 400 L 380 400 L 380 310 Z" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <!-- Amber Accent on Funnel Entrance Filter Line -->
  <line x1="335" y1="195" x2="465" y2="195" stroke="#F59E0B" stroke-width="3" />
  <line x1="360" y1="245" x2="440" y2="245" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="380" y1="285" x2="420" y2="285" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="3 2" />
  
  <!-- Directing Arrows -->
  <path d="M 430 350 L 510 350" stroke="#1E40AF" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="505,345 520,350 505,355" fill="#1E40AF" />
  
  <!-- Right Side: Clean, Structured, Perfectly Aligned Data Rows -->
  <g transform="translate(530, 160)">
    <rect x="0" y="0" width="170" height="280" rx="4" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
    <rect x="0" y="0" width="170" height="35" rx="4" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
    <line x1="20" y1="18" x2="80" y2="18" stroke="#1E40AF" stroke-width="2" />
    
    <!-- Clean Row 1 -->
    <line x1="0" y1="85" x2="170" y2="85" stroke="#1E40AF" stroke-width="1" />
    <line x1="20" y1="60" x2="150" y2="60" stroke="#1E40AF" stroke-width="1.5" />
    
    <!-- Clean Row 2 -->
    <line x1="0" y1="135" x2="170" y2="135" stroke="#1E40AF" stroke-width="1" />
    <line x1="20" y1="110" x2="150" y2="110" stroke="#1E40AF" stroke-width="1.5" />
    
    <!-- Clean Row 3 -->
    <line x1="0" y1="185" x2="170" y2="185" stroke="#1E40AF" stroke-width="1" />
    <line x1="20" y1="160" x2="150" y2="160" stroke="#1E40AF" stroke-width="1.5" />
    
    <!-- Clean Row 4 -->
    <line x1="0" y1="235" x2="170" y2="235" stroke="#1E40AF" stroke-width="1" />
    <line x1="20" y1="210" x2="150" y2="210" stroke="#1E40AF" stroke-width="1.5" />
    
    <!-- Clean Row 5 -->
    <line x1="20" y1="258" x2="150" y2="258" stroke="#1E40AF" stroke-width="1.5" />
  </g>
</svg>
