<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FAFAF7" />
  
  <!-- Central Smartphone with Feed Grid -->
  <rect x="180" y="90" width="200" height="410" rx="16" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <rect x="195" y="130" width="170" height="330" rx="4" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <circle cx="280" cy="110" r="3" fill="#1E40AF" />
  
  <!-- Feed Profile & Grid -->
  <circle cx="225" cy="160" r="14" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="250" y1="155" x2="330" y2="155" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="250" y1="168" x2="300" y2="168" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- 3x3 Photo Grid inside Phone -->
  <rect x="205" y="200" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  <rect x="257" y="200" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  <rect x="310" y="200" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  
  <rect x="205" y="252" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  <rect x="257" y="252" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  <rect x="310" y="252" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  
  <rect x="205" y="304" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  <rect x="257" y="304" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  <rect x="310" y="304" width="45" height="45" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1" />
  
  <!-- Content Calendar (Right) -->
  <rect x="440" y="150" width="220" height="240" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <rect x="440" y="150" width="220" height="45" rx="8" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="460" y1="172" x2="520" y2="172" stroke="#1E40AF" stroke-width="2" />
  
  <!-- Calendar Grid -->
  <rect x="460" y="215" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <rect x="500" y="215" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <rect x="540" y="215" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <rect x="580" y="215" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  
  <rect x="460" y="255" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <!-- Scheduled Post date with Amber accent -->
  <rect x="500" y="255" width="30" height="30" rx="3" fill="#F59E0B" stroke="#F59E0B" stroke-width="1" />
  <rect x="540" y="255" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <rect x="580" y="255" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  
  <rect x="460" y="295" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <rect x="500" y="295" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <rect x="540" y="295" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <rect x="580" y="295" width="30" height="30" rx="3" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  
  <!-- Subtle link line from calendar to phone -->
  <path d="M 440 270 L 380 270" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="4 3" />
</svg>
