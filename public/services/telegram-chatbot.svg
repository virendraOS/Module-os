<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FAFAF7" />
  
  <!-- Outer Conversation Card -->
  <rect x="200" y="110" width="400" height="380" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <line x1="200" y1="160" x2="600" y2="160" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="230" y1="135" x2="310" y2="135" stroke="#1E40AF" stroke-width="2" />
  
  <!-- Notification Alert Badge (Top Right) with Amber Accent -->
  <circle cx="560" cy="135" r="12" fill="#F59E0B" />
  <line x1="560" y1="130" x2="560" y2="137" stroke="#111827" stroke-width="2" />
  <circle cx="560" cy="141" r="1.5" fill="#111827" />
  
  <!-- Routine Notification Alert Bubble (Center) -->
  <rect x="240" y="190" width="320" height="75" rx="6" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <circle cx="265" cy="225" r="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="285" y1="215" x2="520" y2="215" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="285" y1="235" x2="460" y2="235" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Command Action Response Bubble -->
  <rect x="240" y="285" width="280" height="70" rx="6" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <line x1="265" y1="310" x2="480" y2="310" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="265" y1="330" x2="410" y2="330" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Interactive Bot Command Buttons -->
  <rect x="240" y="380" width="95" height="32" rx="4" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="260" y1="396" x2="315" y2="396" stroke="#1E40AF" stroke-width="1.5" />
  
  <rect x="350" y="380" width="95" height="32" rx="4" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="370" y1="396" x2="425" y2="396" stroke="#1E40AF" stroke-width="1.5" />
  
  <rect x="460" y="380" width="95" height="32" rx="4" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="480" y1="396" x2="535" y2="396" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Bottom Bar -->
  <line x1="200" y1="440" x2="600" y2="440" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="230" y1="465" x2="350" y2="465" stroke="#1E40AF" stroke-width="1" stroke-dasharray="3 3" />
</svg>
