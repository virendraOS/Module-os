<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FAFAF7" />
  
  <!-- Outer Conversation Frame -->
  <rect x="200" y="100" width="400" height="400" rx="12" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <line x1="200" y1="150" x2="600" y2="150" stroke="#1E40AF" stroke-width="1.5" />
  <circle cx="230" cy="125" r="8" fill="#1E40AF" />
  <line x1="250" y1="125" x2="330" y2="125" stroke="#1E40AF" stroke-width="2" />
  
  <!-- Customer Chat Bubble 1 (Left) -->
  <path d="M 240 180 L 400 180 A 10 10 0 0 1 410 190 L 410 230 A 10 10 0 0 1 400 240 L 250 240 L 230 255 L 235 240 A 10 10 0 0 1 230 230 L 230 190 A 10 10 0 0 1 240 180 Z" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="255" y1="205" x2="385" y2="205" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="255" y1="220" x2="335" y2="220" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Automated Chatbot Reply Bubble (Right) with Amber Accent dot -->
  <path d="M 390 270 L 550 270 A 10 10 0 0 1 560 280 L 560 330 A 10 10 0 0 1 550 340 L 565 355 L 545 340 L 390 340 A 10 10 0 0 1 380 330 L 380 280 A 10 10 0 0 1 390 270 Z" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2" />
  <!-- Small Amber Accent on active response tag -->
  <circle cx="405" cy="295" r="4" fill="#F59E0B" />
  <line x1="420" y1="295" x2="535" y2="295" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="405" y1="315" x2="495" y2="315" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Customer Followup Bubble (Left) -->
  <path d="M 240 370 L 420 370 A 10 10 0 0 1 430 380 L 430 420 A 10 10 0 0 1 420 430 L 250 430 L 230 445 L 235 430 A 10 10 0 0 1 230 420 L 230 380 A 10 10 0 0 1 240 370 Z" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="255" y1="395" x2="405" y2="395" stroke="#1E40AF" stroke-width="1.5" />
  <line x1="255" y1="410" x2="350" y2="410" stroke="#1E40AF" stroke-width="1.5" />
  
  <!-- Bottom Input Bar -->
  <rect x="220" y="455" width="360" height="30" rx="15" fill="#FAFAF7" stroke="#1E40AF" stroke-width="1" />
  <line x1="240" y1="470" x2="320" y2="470" stroke="#1E40AF" stroke-width="1" stroke-dasharray="3 3" />
</svg>
